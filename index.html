<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ruining Subs</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; background:#0a0a0a; color:#fff; min-height:100vh; }
    #age-gate {
      position:fixed; inset:0; background:#000; z-index:9999;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:24px; text-align:center;
    }
    #age-gate.hidden { display:none !important; }
    h1 { font-size:2rem; margin-bottom:12px; }
    h1 span { color:#ff7a00; }
    p { color:#aaa; margin-bottom:28px; max-width:300px; line-height:1.4; }
    .btn {
      border:none; border-radius:999px; padding:14px 28px; font-weight:700;
      font-size:16px; cursor:pointer; margin:6px;
    }
    .btn-primary { background:#ff7a00; color:#000; }
    .btn-secondary { background:#222; color:#fff; border:1px solid #333; }
    #app { display:none; padding:16px; padding-bottom:100px; max-width:680px; margin:0 auto; }
    #app.show { display:block; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .logo { font-weight:800; font-size:1.2rem; }
    .logo span { color:#ff7a00; }
    .banner {
      background:rgba(255,122,0,0.15); border:1px solid rgba(255,122,0,0.3);
      border-radius:16px; padding:20px; text-align:center; margin-bottom:20px;
    }
    .banner .num { font-size:2rem; font-weight:800; color:#ff7a00; }
    .post {
      background:#121212; border:1px solid #2a2a2a; border-radius:16px;
      padding:16px; margin-bottom:12px;
    }
    .bottom-nav {
      position:fixed; bottom:0; left:0; right:0; background:#0a0a0a;
      border-top:1px solid #2a2a2a; display:flex; justify-content:space-around;
      padding:12px 0 24px; z-index:90;
    }
    .nav-item { background:none; border:none; color:#888; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:4px; }
    .nav-item.active { color:#ff7a00; }
    .nav-center {
      width:52px; height:52px; border-radius:50%; background:#ff7a00; color:#000;
      font-size:28px; font-weight:700; border:none; margin-top:-16px;
    }
  </style>
</head>
<body>
  <div id="age-gate">
    <div style="width:56px;height:56px;background:#ff7a00;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#000;margin-bottom:16px;">RS</div>
    <h1>Ruining <span>Subs</span></h1>
    <p>This site contains adult exposure content. You must be 18+ to enter.</p>
    <button class="btn btn-primary" id="btn-enter">I am 18 or older</button>
    <button class="btn btn-secondary" id="btn-exit">Exit</button>
  </div>

  <div id="app">
    <header>
      <div class="logo">Ruining<span>Subs</span></div>
      <div>👤</div>
    </header>
    <div class="banner">
      <div class="num" id="online">42</div>
      <div style="color:#aaa;font-size:14px;">people online</div>
      <button class="btn btn-primary" style="margin-top:14px;" id="btn-public">Go public now</button>
    </div>
    <div id="feed">
      <div class="post">
        <strong>@exposedpig</strong>
        <div style="color:#aaa;font-size:13px;margin:6px 0;">Please keep me exposed longer</div>
        <div style="font-size:12px;color:#888;">👁 342 · ❤️ 28 · ⏱ 3 ext</div>
      </div>
      <div class="post">
        <strong>@sissyboy88</strong>
        <div style="color:#aaa;font-size:13px;margin:6px 0;">Public ruin challenge - day 3</div>
        <div style="font-size:12px;color:#888;">👁 891 · ❤️ 67 · ⏱ 12 ext</div>
      </div>
    </div>
    <nav class="bottom-nav">
      <button class="nav-item active"><span>🏠</span>Feed</button>
      <button class="nav-item"><span>🔍</span>Explore</button>
      <button class="nav-center">+</button>
      <button class="nav-item"><span>💬</span>Messages</button>
      <button class="nav-item"><span>👤</span>Profile</button>
    </nav>
  </div>

  <script>
    function enter() {
      document.getElementById('age-gate').classList.add('hidden');
      document.getElementById('app').classList.add('show');
    }
    document.getElementById('btn-enter').onclick = enter;
    document.getElementById('btn-exit').onclick = function() {
      window.location.href = 'https://google.com';
    };
    document.getElementById('btn-public').onclick = function() {
      alert('Publish form coming next — age gate works!');
    };
    setInterval(function() {
      document.getElementById('online').textContent = 30 + Math.floor(Math.random() * 30);
    }, 8000);
  </script>
</body>
</html>
